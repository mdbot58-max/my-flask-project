<!DOCTYPE html>
<html>

<head>
    <title>Edit Patient</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Edit Patient</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ patient[1] }}"
            required
        >

        <input
            type="number"
            name="age"
            value="{{ patient[2] }}"
            required
        >

        <input
            type="text"
            name="gender"
            value="{{ patient[3] }}"
            required
        >

        <input
            type="text"
            name="phone"
            value="{{ patient[4] }}"
            required
        >

        <input
            type="text"
            name="disease"
            value="{{ patient[5] }}"
            required
        >

        <button type="submit">
            Update Patient
        </button>

    </form>

</div>

</body>

</html>
