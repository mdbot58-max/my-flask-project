<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Hospital Dashboard</h1>

    <h2>Welcome, {{ username }}</h2>

    <div class="dashboard">

        <div class="box">
            <h3>Patients</h3>
            <p>{{ patient_count }}</p>
        </div>

        <div class="box">
            <h3>Appointments</h3>
            <p>{{ appointment_count }}</p>
        </div>

    </div>

    <br>

    <a href="/add_patient">
        Add Patient
    </a>

    <br><br>

    <a href="/patients">
        View Patients
    </a>

    <br><br>

    <a href="/appointment">
        Book Appointment
    </a>

    <br><br>

    <a href="/logout">
        Logout
    </a>

</div>

</body>

</html>
