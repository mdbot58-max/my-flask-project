<!DOCTYPE html>
<html>

<head>
    <title>Add Patient</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Patient Registration</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Patient Name"
            required
        >

        <input
            type="number"
            name="age"
            placeholder="Age"
            required
        >

        <input
            type="text"
            name="gender"
            placeholder="Gender"
            required
        >

        <input
            type="text"
            name="phone"
            placeholder="Phone"
            required
        >

        <input
            type="text"
            name="disease"
            placeholder="Disease"
            required
        >

        <button type="submit">
            Add Patient
        </button>

    </form>

    <br>

    <a href="/">Back to Dashboard</a>

</div>

</body>

</html>
